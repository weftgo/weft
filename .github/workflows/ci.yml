name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Support policy: current Go release and N-1 (go.mod pins the
        # minimum). See README "Development".
        go-version: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      # One module per adapter (ADR 0005): loop over the workspace the
      # same way `make test` does. The live suite is never in CI — no
      # keys; it is a release-time manual step.
      - name: vet (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && go vet ./...)
          done
      - name: test (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && go test -race ./...)
          done
      - name: build (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && go build ./...)
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # golangci-lint per module, all sharing the root .golangci.yml.
      # Pinned so lint results do not drift with HEAD (staticcheck's
      # rule set changes between minor versions).
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      - name: lint (every module)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml")
          done

  # The selvedge (TODO §1.7): the root module's public API is compared
  # against the last root tag and any incompatible change fails the
  # build unless it is acknowledged in .apidiff-allow (pre-1.0 only).
  # Adapters are separate modules and get their own gate when they tag.
  apidiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to find the base
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # Pinned, like golangci-lint below, so gate results do not drift
      # with HEAD.
      - name: install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba
      # The gate must fail closed: exercise its own failure modes (a
      # non-compiling tree, an incompatible rename) before trusting it.
      - name: apidiff self-test (the gate fails closed)
        run: scripts/apidiff-selftest.sh
      - name: apidiff (root module vs last tag)
        run: scripts/apidiff.sh
      - name: apidiff (thread module vs last thread tag)
        run: scripts/apidiff.sh "" thread

  # The gated ClickHouse suite (obsdb/clickhouse's README "CI job
  # (service container)" block): the conformance table and the
  # collector-shape insert test need a server; each test creates and
  # drops its own database. The same DSN also un-gates studio/cmd's
  # hosted-backend test.
  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_PASSWORD: weft
        ports:
          - 9000:9000
        ulimits:
          nofile: 262144:262144
    env:
      WEFT_CLICKHOUSE_DSN: clickhouse://default:weft@127.0.0.1:9000/default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: test (obsdb/clickhouse, gated suite)
        run: |
          cd obsdb/clickhouse && go test -race ./...
      - name: test (studio/cmd, gated --db clickhouse:// test)
        run: |
          cd studio/cmd && go test -race -run TestNewServerClickhouse ./...

  # The offline gate (ADR 0013's kill-switch clause): the whole
  # workspace stays green under WEFT_MODEL_REQUESTS=deny — suites that
  # must never reach the network get loud failures, not silent egress.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: test (every module, WEFT_MODEL_REQUESTS=deny)
        run: |
          for m in $(go list -m -f '{{.Dir}}'); do
            (cd "$m" && WEFT_MODEL_REQUESTS=deny go test ./...)
          done

  # The fuzz gate (TODO §9.4): every Fuzz* target of the root module
  # and of thread's decoders (plan §10, step 7.1) runs for FUZZTIME on
  # stable Go. Not under -race (the seeds already run under -race in
  # `test`). A crasher fails the job and its input is uploaded so the
  # fix PR can commit it as a seed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: fuzz (root module, 10s per target)
        run: make fuzz
      - name: fuzz (thread module, 10s per target)
        run: make fuzz-thread
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            testdata/fuzz
            thread/testdata/fuzz
          if-no-files-found: ignore

  # The studio freshness gate (ADR 0018 §4): rebuild the web app, prove
  # the committed studio/dist matches byte for byte and fits the 600 KiB
  # gzip budget, then run the web typecheck and tests. Bun is pinned to
  # the version the committed dist was built with.
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: make studio-check
        run: make studio-check
